<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <!-- Dark chip background -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <!-- Corner pins (top) -->
  <rect x="6"  y="0" width="2" height="4" rx="1" fill="#30363d"/>
  <rect x="12" y="0" width="2" height="4" rx="1" fill="#30363d"/>
  <rect x="18" y="0" width="2" height="4" rx="1" fill="#30363d"/>
  <rect x="24" y="0" width="2" height="4" rx="1" fill="#30363d"/>
  <!-- Corner pins (bottom) -->
  <rect x="6"  y="28" width="2" height="4" rx="1" fill="#30363d"/>
  <rect x="12" y="28" width="2" height="4" rx="1" fill="#30363d"/>
  <rect x="18" y="28" width="2" height="4" rx="1" fill="#30363d"/>
  <rect x="24" y="28" width="2" height="4" rx="1" fill="#30363d"/>
  <!-- Corner pins (left) -->
  <rect x="0" y="6"  width="4" height="2" rx="1" fill="#30363d"/>
  <rect x="0" y="12" width="4" height="2" rx="1" fill="#30363d"/>
  <rect x="0" y="18" width="4" height="2" rx="1" fill="#30363d"/>
  <rect x="0" y="24" width="4" height="2" rx="1" fill="#30363d"/>
  <!-- Corner pins (right) -->
  <rect x="28" y="6"  width="4" height="2" rx="1" fill="#30363d"/>
  <rect x="28" y="12" width="4" height="2" rx="1" fill="#30363d"/>
  <rect x="28" y="18" width="4" height="2" rx="1" fill="#30363d"/>
  <rect x="28" y="24" width="4" height="2" rx="1" fill="#30363d"/>
  <!-- Inner chip die -->
  <rect x="7" y="7" width="18" height="18" rx="2" fill="#161b22" stroke="#21262d" stroke-width="0.5"/>
  <!-- "P" letter with gradient -->
  <text x="16" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="15" font-weight="900" text-anchor="middle" fill="url(#g)">P</text>
</svg>
